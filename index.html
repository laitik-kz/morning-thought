<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Утренняя мысль разработчика</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script src="anim/data.js"></script>
<style>
/* Layout: окно в Алматы — живая SVG-сцена на весь экран, по центру стеклянная карточка с мыслью.
   Единый «оконный» мир: цвета задаёт погода и время суток, а не тема ОС. */
:root {
  color-scheme: dark;
  --ink: #f8fafc;          /* текст на стекле */
  --ink-dim: #cbd5e1;      /* второстепенный текст */
  --glass: rgba(12, 18, 32, .34);
  --glass-edge: rgba(255, 255, 255, .28);
  --sun: #ffd166;          /* акцент: рассветное солнце */
  --sun-ink: #1b1f2a;
  --sill: #6b4430;
  --font-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --font-body: "Manrope", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
  --sky-top: #4f9fe0; --sky-bottom: #c4e6f8;
}
:root[data-sky="clear-day"]   { --sky-top: #3f8fd6; --sky-bottom: #bfe3f7; }
:root[data-sky="cloudy-day"]  { --sky-top: #7b8ea3; --sky-bottom: #cfd8e0; }
:root[data-sky="rain-day"]    { --sky-top: #46566a; --sky-bottom: #8796a6; }
:root[data-sky="snow-day"]    { --sky-top: #9cb2c8; --sky-bottom: #e6edf3; }
:root[data-sky$="-night"]     { --sky-top: #0a1430; --sky-bottom: #2b3b68; }
:root[data-sky="cloudy-night"],
:root[data-sky="rain-night"]  { --sky-top: #141b29; --sky-bottom: #374257; }
:root[data-sky="snow-night"]  { --sky-top: #1c2a44; --sky-bottom: #51627f; }

html, body { height: 100%; }
body { margin: 0; background: var(--sky-top); color: var(--ink); font-family: var(--font-body); overflow-x: hidden; }

#scene { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* фото-фон под погоду: плавная смена кадров и медленный наплыв */
#photo { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--sky-top); }
#photo .ph { position: absolute; inset: -2%; background-size: cover; background-position: center 45%; opacity: 0; transition: opacity 1.4s ease; animation: kenburns 40s ease-in-out infinite alternate; }
#photo .ph.on { opacity: 1; }
#photo .ph[data-kind="rain"] { filter: brightness(.72) saturate(.8); }
:root[data-sky="snow-night"] #photo .ph[data-kind="snow"] { filter: brightness(.45) saturate(.7); }
#photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,.18), rgba(0,0,0,0) 35%, rgba(0,0,0,.35)); }
@keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.08) translate(-1%, -1%); } }
#scene { z-index: 1; }
#fx { z-index: 2; }
.owl, .cat { transition: opacity 1s; }
.owl { opacity: 0; }
:root[data-sky$="-night"] .cat { opacity: 0; }
:root[data-sky$="-night"] .owl { opacity: 1; }
.window-light { opacity: 0; transition: opacity 1s; }

/* анимации сцены */
.steam path { animation: steam 3s ease-in-out infinite; opacity: 0; }
.steam path:nth-child(2) { animation-delay: 1s; }
.steam path:nth-child(3) { animation-delay: 2s; }
@keyframes steam { 0% { opacity: 0; transform: translateY(8px); } 40% { opacity: .7; } 100% { opacity: 0; transform: translateY(-22px); } }
.lottie-box { width: 100%; height: 100%; }
.pet { cursor: pointer; }
:root:not([data-sky$="-night"]) .owl, :root[data-sky$="-night"] .cat { pointer-events: none; visibility: hidden; transition: visibility 0s 1s; }
.pet.perk { animation: perk .6s ease; transform-box: fill-box; transform-origin: bottom center; }
@keyframes perk { 30% { transform: translateY(-14px) rotate(-4deg); } 60% { transform: translateY(0) rotate(3deg); } }

/* стеклянная карточка */
.glass {
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(18px) saturate(1.4);
  backdrop-filter: blur(18px) saturate(1.4);
  box-shadow: 0 20px 60px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .25);
}
.title { font-family: var(--font-display); letter-spacing: .02em; text-wrap: balance; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.quote { font-family: var(--font-body); text-wrap: pretty; text-shadow: 0 1px 12px rgba(0, 0, 0, .25); }
.flip-out { animation: flipOut .26s ease-in forwards; }
.flip-in { animation: flipIn .38s cubic-bezier(.2, .9, .3, 1.2); }
@keyframes flipOut { to { transform: perspective(700px) rotateX(80deg); opacity: 0; } }
@keyframes flipIn { from { transform: perspective(700px) rotateX(-80deg); opacity: 0; } }
.btn { transition: transform .15s, box-shadow .2s, background .2s; }
.btn:active { transform: scale(.95); }
.btn:focus-visible, .chip:focus-visible, .pet:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
.btn-primary { background: var(--sun); color: var(--sun-ink); box-shadow: 0 6px 24px rgba(255, 209, 102, .35); }
.btn-primary:hover { box-shadow: 0 8px 32px rgba(255, 209, 102, .55); }
.btn-ghost { background: rgba(255, 255, 255, .12); color: var(--ink); border: 1px solid var(--glass-edge); }
.btn-ghost:hover { background: rgba(255, 255, 255, .2); }
.chip { background: rgba(255, 255, 255, .1); border: 1px solid transparent; color: var(--ink-dim); transition: background .2s, color .2s; }
.chip:hover { background: rgba(255, 255, 255, .18); color: var(--ink); }
.chip[aria-pressed="true"] { background: rgba(255, 255, 255, .26); border-color: var(--glass-edge); color: var(--ink); }
#toast { transition: opacity .25s, transform .25s; }
#toast.hide { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<div id="photo" aria-hidden="true">
  <div class="ph" data-kind="clear" style="background-image:url('photos/clear.jpg')"></div>
  <div class="ph" data-kind="cloudy" style="background-image:url('photos/cloudy.jpg')"></div>
  <div class="ph" data-kind="rain" style="background-image:url('photos/rain.jpg')"></div>
  <div class="ph" data-kind="snow" style="background-image:url('photos/snow.jpg')"></div>
  <div class="ph" data-kind="night" style="background-image:url('photos/night.jpg')"></div>
</div>

<svg id="scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <!-- подоконник -->
  <rect x="0" y="818" width="1600" height="82" style="fill:var(--sill)"/>
  <rect x="0" y="818" width="1600" height="8" fill="#8a5a3f"/>

  <!-- котик (день) и сова (ночь): анимации LottieFiles -->
  <foreignObject class="cat pet" id="cat" x="530" y="578" width="300" height="300" tabindex="0" role="button" aria-label="Погладить котика"><div xmlns="http://www.w3.org/1999/xhtml" class="lottie-box" data-anim="cat"></div></foreignObject>
  <foreignObject class="owl pet" id="owl" x="555" y="632" width="260" height="200" tabindex="0" role="button" aria-label="Погладить сову"><div xmlns="http://www.w3.org/1999/xhtml" class="lottie-box" data-anim="owl"></div></foreignObject>

  <!-- кружка кофе -->
  <g>
    <g class="steam" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
      <path d="M930 760 q-8 -12 0 -24 q8 -12 0 -24"/>
      <path d="M946 762 q-8 -12 0 -24 q8 -12 0 -24"/>
      <path d="M962 760 q-8 -12 0 -24 q8 -12 0 -24"/>
    </g>
    <rect x="914" y="770" width="64" height="50" rx="8" fill="#f1ece4"/>
    <path d="M978 782 q22 0 22 16 q0 16 -22 16" fill="none" stroke="#f1ece4" stroke-width="8"/>
    <text x="946" y="801" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600" fill="#6b4430">{ }</text>
  </g>
</svg>

<canvas id="fx" aria-hidden="true"></canvas>

<main class="pointer-events-none relative z-10 min-h-dvh flex flex-col items-center justify-center gap-5 px-4 pt-8 pb-[26vh]">
  <article id="card" class="pointer-events-auto glass w-full max-w-xl rounded-[28px] p-6 sm:p-8 flex flex-col gap-6">
    <header class="flex flex-wrap items-center justify-between gap-3">
      <h1 class="title text-sm sm:text-base font-semibold">Утренняя мысль разработчика</h1>
      <span id="today" class="mono text-xs text-[color:var(--ink-dim)]"></span>
    </header>

    <div class="min-h-[8.5rem] flex items-center">
      <blockquote id="quote" class="quote text-2xl sm:text-[1.7rem] leading-snug font-semibold" aria-live="polite"></blockquote>
    </div>

    <div class="flex flex-wrap items-center gap-3">
      <button id="next" type="button" class="btn btn-primary rounded-full px-6 py-3 font-bold">Новая мысль</button>
      <button id="copy" type="button" class="btn btn-ghost rounded-full px-5 py-3 font-semibold">Копировать</button>
      <span id="qid" class="mono text-xs text-[color:var(--ink-dim)] ml-auto"></span>
    </div>

    <footer class="flex flex-col gap-3 pt-4 border-t border-white/15">
      <div class="flex flex-wrap items-baseline justify-between gap-2">
        <p id="weather" class="text-sm font-semibold">Алматы · загружаю погоду…</p>
        <p id="wsource" class="mono text-[11px] text-[color:var(--ink-dim)]"></p>
      </div>
      <div class="flex flex-wrap gap-2" role="group" aria-label="Погода на картинке">
        <button type="button" class="chip rounded-full px-3 py-1 text-xs" data-mode="auto" aria-pressed="true">Авто</button>
        <button type="button" class="chip rounded-full px-3 py-1 text-xs" data-mode="clear">Ясно</button>
        <button type="button" class="chip rounded-full px-3 py-1 text-xs" data-mode="cloudy">Облачно</button>
        <button type="button" class="chip rounded-full px-3 py-1 text-xs" data-mode="rain">Дождь</button>
        <button type="button" class="chip rounded-full px-3 py-1 text-xs" data-mode="snow">Снег</button>
        <button type="button" class="chip rounded-full px-3 py-1 text-xs" data-mode="night">Ночь</button>
      </div>
    </footer>
  </article>
</main>

<div id="toast" role="status" aria-live="polite" class="hide glass fixed left-1/2 bottom-8 z-20 -translate-x-1/2 rounded-full px-5 py-2 text-sm font-semibold"></div>

<script>
(() => {
  // ---------- данные ----------
  const ALMATY = { lat: 43.238, lon: 76.946, tz: 'Asia/Almaty' };
  // Снимок на момент публикации — на случай, если сеть или CSP не пустят к API
  const SNAPSHOT = { temp: 17.7, code: 0, isDay: 1, time: '2026-10-11T15:45' };

  const THOUGHTS = [
    { t: 'Сегодня я напишу код, который завтрашний я поймёт без кофе.' },
    { t: 'Каждый баг — это фича, которую ещё не объяснили заказчику.' },
    { t: "SELECT * FROM день WHERE настроение = 'отличное'. Пусть план запроса будет быстрым." },
    { t: 'Не бойся ошибок в проде. Бойся тишины в логах.' },
    { t: 'Хороший коммит пишут так, будто его прочитает человек в три часа ночи. Так и будет.' },
    { t: 'Сначала сделай, чтобы работало. Потом — чтобы было понятно. Потом — чтобы быстро.' },
    { t: 'Самый быстрый запрос — тот, который не нужно выполнять.' },
    { t: 'Документация — это письмо себе в будущее. Будь вежлив.' },
    { t: 'Утро начинается с git pull. Кофе — сразу после.' },
    { t: 'Если задача кажется простой, ты ещё не открыл ТЗ.' },
    { t: 'Индекс не волшебство. Но иногда очень похоже.' },
    { t: '«У меня работает» — не диагноз, а начало расследования.' },
    { t: 'Чем короче функция, тем спокойнее сон.' },
    { t: 'NULL — это вежливое «не знаю». Будь как NULL: честен.' },
    { t: 'Лучший рефакторинг — тот, после которого тесты остались зелёными.' },
    { t: 'Спроси «зачем» трижды, прежде чем писать первую строчку.' },
    { t: 'Ты не медленный. Ты читаешь код внимательнее, чем его писали.' },
    { t: 'Каждый JOIN — знакомство двух таблиц. Проверь, что они подходят друг другу по ключу.' },
    { t: 'Не оптимизируй то, что ещё не измерил.' },
    { t: 'Сегодня хороший день, чтобы удалить код, который никто не вызывает.' },
    { t: 'Маленький шаг с коммитом лучше большого шага без сохранения.' },
    { t: 'Ошибка в консоли — подсказка, а не приговор.' },
    { t: 'Заказчик узнаёт, чего хочет, когда видит то, чего не хотел. Покажи ему что-нибудь пораньше.' },
    { t: 'Комментарий объясняет «почему». «Что» код скажет сам.' },
    { t: 'GROUP BY задач на сегодня: срочное, важное и «потом».' },
    { t: 'Вчерашний костыль — сегодняшняя архитектура. Выбирай костыли с любовью.' },
    { t: 'Транзакция учит главному: либо всё, либо ничего, но без полумер.' },
    { t: 'EXPLAIN ANALYZE — лучший психотерапевт для медленного запроса.' },

    { t: 'Солнце над Алатау — пора открыть окно и закрыть лишние вкладки.', tags: ['clear'] },
    { t: 'Ясное небо как чистый git status. Наслаждайся, пока можно.', tags: ['clear'] },
    { t: 'В такую погоду даже легаси-код выглядит дружелюбнее.', tags: ['clear'] },
    { t: 'Облака — это просто распределённые вычисления над Алматы.', tags: ['cloudy'] },
    { t: 'Пасмурно — значит, никаких бликов на мониторе. Время для глубокой работы.', tags: ['cloudy'] },
    { t: 'Даже за облаками сервер продолжает отвечать 200 OK.', tags: ['cloudy'] },
    { t: 'Дождь стучит по подоконнику, как юнит-тесты: ритмично и иногда красным.', tags: ['rain'] },
    { t: 'В дождь баги ищутся лучше: никто не зовёт гулять.', tags: ['rain'] },
    { t: 'Капли на стекле — асинхронные события. Не обрабатывай все сразу.', tags: ['rain'] },
    { t: 'Снег над Алматы как свежая схема БД: красиво, пока по ней никто не прошёл.', tags: ['snow'] },
    { t: 'Снаружи холодно, внутри — горячий кофе и прогретый кэш.', tags: ['snow'] },
    { t: 'Каждая снежинка уникальна, как PRIMARY KEY.', tags: ['snow'] },
    { t: 'Сова знает: лучшие идеи приходят после полуночи, а лучшие решения — после сна.', tags: ['night'] },
    { t: 'Ночной деплой — смелость. Утренний — мудрость.', tags: ['night'] },
    { t: 'Ночь — время, когда логи наконец читают тебя.', tags: ['night'] },

    { t: 'Понедельник — релиз новой недели. Прочитай changelog внимательно.', tags: ['mon'] },
    { t: 'В понедельник план громкий, а коммиты тихие. Начни с одного.', tags: ['mon'] },
    { t: 'Пятница. Деплой в прод подождёт до понедельника.', tags: ['fri'] },
    { t: 'Пятничный коммит должен быть таким маленьким, чтобы его можно было откатить взглядом.', tags: ['fri'] },
    { t: 'Выходной. Если код снится — он либо очень хороший, либо очень плохой.', tags: ['weekend'] },
    { t: 'Выходные — время, когда pet-проект наконец получает внимание.', tags: ['weekend'] },

    { t: 'Утренний мозг — это продакшн. Не трать его на почту.', tags: ['morning'] },
    { t: 'Первые полчаса — самой сложной задаче. Почта терпеливая, подождёт.', tags: ['morning'] },
    { t: 'Уже не утро? У разработчика утро начинается с первого успешного билда.', tags: ['late'] },
  ];

  const TAG_NAMES = {
    general: 'общая', clear: 'ясно', cloudy: 'облачно', rain: 'дождь', snow: 'снег', night: 'ночь',
    mon: 'понедельник', fri: 'пятница', weekend: 'выходной', morning: 'утро', late: 'не_утро',
  };
  const LABELS = { clear: 'Ясно', cloudy: 'Облачно', rain: 'Дождь', snow: 'Снег' };
  const wmoToKind = c =>
    c <= 1 ? 'clear'
    : c <= 3 || c === 45 || c === 48 ? 'cloudy'
    : (c >= 71 && c <= 77) || c === 85 || c === 86 ? 'snow'
    : 'rain';
  const wmoLabel = c => c === 2 ? 'Переменная облачность' : c === 45 || c === 48 ? 'Туман' : c >= 95 ? 'Гроза' : LABELS[wmoToKind(c)];

  // ---------- состояние ----------
  const $ = id => document.getElementById(id);
  const state = { weather: null, mode: 'auto', scene: { kind: 'clear', day: true }, recent: [], current: null };
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const almatyParts = () => {
    const now = new Date();
    const wd = new Intl.DateTimeFormat('en-US', { weekday: 'short', timeZone: ALMATY.tz }).format(now);
    const hour = +new Intl.DateTimeFormat('en-US', { hour: 'numeric', hourCycle: 'h23', timeZone: ALMATY.tz }).format(now);
    const label = new Intl.DateTimeFormat('ru-RU', { weekday: 'short', day: 'numeric', month: 'long', timeZone: ALMATY.tz }).format(now);
    return { wd, hour, label };
  };

  // ---------- сцена ----------
  function applyScene() {
    let kind, day;
    if (state.mode === 'auto') {
      const w = state.weather || SNAPSHOT;
      kind = wmoToKind(w.code); day = !!w.isDay;
    } else if (state.mode === 'night') {
      kind = 'clear'; day = false;
    } else {
      kind = state.mode; day = true;
    }
    state.scene = { kind, day };
    document.documentElement.dataset.sky = `${kind}-${day ? 'day' : 'night'}`;
    // ночью — ночное фото, кроме снега и дождя: у них свои кадры, затемнённые фильтром
    const photo = !day && (kind === 'clear' || kind === 'cloudy') ? 'night' : kind;
    document.querySelectorAll('#photo .ph').forEach(p => p.classList.toggle('on', p.dataset.kind === photo));
    setPrecip(kind);
  }

  function renderWeather() {
    const w = state.weather || SNAPSHOT;
    const t = Math.round(w.temp);
    const temp = (t > 0 ? '+' : t < 0 ? '−' : '') + Math.abs(t) + '°';
    $('weather').textContent = `Алматы · ${temp} · ${wmoLabel(w.code)}`;
    const hhmm = w.time.slice(11, 16);
    $('wsource').textContent = state.weather
      ? `Open-Meteo, сейчас ${hhmm}`
      : location.protocol === 'file:'
        ? `снимок на 11.10 ${hhmm}: нет интернета или API не ответил`
        : `снимок на 11.10 ${hhmm}: здесь живая погода закрыта, она работает в файле`;
  }

  async function loadWeather() {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${ALMATY.lat}&longitude=${ALMATY.lon}` +
      `&current=temperature_2m,weather_code,is_day&timezone=${encodeURIComponent(ALMATY.tz)}`;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5000);
    try {
      const res = await fetch(url, { signal: ctrl.signal });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const c = (await res.json()).current;
      state.weather = { temp: c.temperature_2m, code: c.weather_code, isDay: c.is_day, time: c.time };
    } catch (e) {
      state.weather = null; // остаётся снимок
    } finally {
      clearTimeout(timer);
    }
    renderWeather();
    applyScene();
  }

  // ---------- мысли ----------
  function contextTags() {
    const { wd, hour } = almatyParts();
    const tags = [state.scene.kind];
    if (!state.scene.day) tags.push('night');
    if (wd === 'Mon') tags.push('mon');
    if (wd === 'Fri') tags.push('fri');
    if (wd === 'Sat' || wd === 'Sun') tags.push('weekend');
    tags.push(hour >= 5 && hour < 12 ? 'morning' : 'late');
    return tags;
  }

  function pickThought() {
    const tags = contextTags();
    const fresh = THOUGHTS.map((x, i) => ({ ...x, i })).filter(x => !state.recent.includes(x.i));
    const matched = fresh.filter(x => x.tags && x.tags.some(tg => tags.includes(tg)));
    const general = fresh.filter(x => !x.tags);
    // каждая вторая мысль — «по погоде и дню», если такие остались
    const pool = matched.length && Math.random() < 0.5 ? matched : general.length ? general : fresh;
    const pick = pool[Math.floor(Math.random() * pool.length)];
    state.recent.push(pick.i);
    if (state.recent.length > 8) state.recent.shift();
    return pick;
  }

  function showThought(animate) {
    const pick = pickThought();
    state.current = pick;
    const q = $('quote');
    const put = () => {
      q.textContent = pick.t;
      $('qid').textContent = (pick.tags || ['general']).map(tg => '#' + TAG_NAMES[tg]).join(' ');
    };
    if (!animate || reduceMotion) { put(); return; }
    q.classList.remove('flip-in');
    q.classList.add('flip-out');
    setTimeout(() => {
      put();
      q.classList.remove('flip-out');
      void q.offsetWidth;
      q.classList.add('flip-in');
    }, 260);
  }

  // ---------- копирование ----------
  let toastTimer;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.remove('hide');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add('hide'), 2200);
  }

  async function copyQuote() {
    const text = `«${state.current.t}»\n— утренняя мысль разработчика, Алматы`;
    try {
      await navigator.clipboard.writeText(text);
      toast('Скопировано в буфер');
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (_) {}
      ta.remove();
      if (ok) { toast('Скопировано в буфер'); return; }
      const r = document.createRange();
      r.selectNodeContents($('quote'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      toast('Текст выделен — нажмите Ctrl+C');
    }
  }

  // ---------- эффекты: осадки и частицы ----------
  const cv = $('fx'), ctx = cv.getContext('2d');
  let W = 0, H = 0, dpr = 1;
  const drops = [], sparks = [];
  let precip = 'none';

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function setPrecip(kind) {
    precip = kind === 'rain' || kind === 'snow' ? kind : 'none';
    drops.length = 0;
    if (precip === 'none') return;
    const n = reduceMotion ? 40 : precip === 'rain' ? 160 : 110;
    for (let i = 0; i < n; i++) drops.push(newDrop(true));
  }

  function newDrop(anywhere) {
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : -10,
      v: precip === 'rain' ? 9 + Math.random() * 6 : 0.6 + Math.random() * 1.2,
      r: precip === 'rain' ? 10 + Math.random() * 10 : 1.5 + Math.random() * 2.5,
      ph: Math.random() * Math.PI * 2,
    };
  }

  function burst(x, y, colors, count = 28) {
    if (reduceMotion) return;
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 5;
      sparks.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 1, c: colors[i % colors.length], r: 2 + Math.random() * 3 });
    }
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);
    if (precip === 'rain') {
      ctx.strokeStyle = 'rgba(210,225,240,.55)'; ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (const d of drops) {
        ctx.moveTo(d.x, d.y); ctx.lineTo(d.x - 2, d.y + d.r);
        d.y += d.v; d.x -= 0.6;
        if (d.y > H) Object.assign(d, newDrop(false));
      }
      ctx.stroke();
    } else if (precip === 'snow') {
      ctx.fillStyle = 'rgba(255,255,255,.9)';
      for (const d of drops) {
        ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
        d.ph += 0.02; d.y += d.v; d.x += Math.sin(d.ph) * 0.6;
        if (d.y > H) Object.assign(d, newDrop(false));
      }
    }
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life -= 0.018;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.globalAlpha = p.life; ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    requestAnimationFrame(frame);
  }

  // ---------- Lottie: котик, сова, солнце ----------
  const anims = {};
  if (window.lottie && window.LOTTIE) {
    document.querySelectorAll('[data-anim]').forEach(box => {
      const name = box.dataset.anim;
      anims[name] = lottie.loadAnimation({ container: box, renderer: 'svg', loop: true, autoplay: !reduceMotion, animationData: window.LOTTIE[name] });
    });
  }

  // ---------- события ----------
  const center = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const SUNNY = ['#ffd166', '#fff3c4', '#ff9f6e', '#ffffff'];

  function perk(el) {
    el.classList.remove('perk'); void el.getBoundingClientRect(); el.classList.add('perk');
    const a = anims[el.id];
    if (a && !reduceMotion) { a.setSpeed(2.5); setTimeout(() => a.setSpeed(1), 1200); }
  }

  $('next').addEventListener('click', e => {
    showThought(true);
    burst(...center(e.currentTarget), SUNNY);
    perk(state.scene.day ? $('cat') : $('owl'));
  });
  $('copy').addEventListener('click', e => {
    copyQuote();
    burst(...center(e.currentTarget), ['#ffffff', '#cfe8ff', '#a5f3c4'], 18);
  });
  for (const pet of [$('cat'), $('owl')]) {
    const pat = () => { perk(pet); burst(...center(pet), ['#ff7aa2', '#ffd1dc', '#ffffff'], 16); toast(pet.id === 'cat' ? 'Мррр… коммить смелее' : 'Угу. Сначала сон, потом деплой'); };
    pet.addEventListener('click', e => { pat(); if (e.detail) pet.blur(); }); // мышь — без рамки фокуса, Tab — с рамкой
    pet.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pat(); } });
  }
  document.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => {
    state.mode = b.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    applyScene();
  }));
  document.addEventListener('keydown', e => {
    if (e.target.closest('button, [role="button"], input, textarea')) return;
    if (e.code === 'Space') { e.preventDefault(); $('next').click(); }
  });
  addEventListener('resize', () => { resize(); setPrecip(state.scene.kind); });

  // ---------- старт ----------
  resize();
  $('today').textContent = almatyParts().label;
  renderWeather();
  applyScene();
  showThought(false);
  requestAnimationFrame(frame);
  loadWeather();
})();
</script>
</body>
</html>
